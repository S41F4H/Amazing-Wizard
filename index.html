<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Spider Boy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0e1a;
    font-family: 'Segoe UI', Arial, sans-serif;
    touch-action: none;
    user-select: none;
  }
  #game-container {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
  }
  canvas { display: block; touch-action: none; }

  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: env(safe-area-inset-top, 16px) 16px 0 16px;
    pointer-events: none;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  #logo {
    font-size: 22px;
    font-weight: 900;
    color: #e62429;
    text-shadow: 0 0 8px rgba(230,36,41,0.6), 2px 2px 0 #000;
    letter-spacing: 1px;
  }
  #stats {
    text-align: right;
    color: #fff;
    font-size: 13px;
    text-shadow: 1px 1px 2px #000;
    line-height: 1.5;
  }
  #stats span { font-weight: 700; color: #4fd1ff; }

  #center-msg {
    position: fixed;
    top: 40%; left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 15px;
    text-align: center;
    text-shadow: 1px 1px 3px #000;
    background: rgba(0,0,0,0.4);
    padding: 12px 20px;
    border-radius: 10px;
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.4s;
    max-width: 80vw;
  }

  #start-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, #1a0f0f 0%, #2b0a0a 60%, #0a0e1a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    color: #fff;
  }
  #start-screen h1 {
    font-size: 44px;
    font-weight: 900;
    color: #e62429;
    text-shadow: 0 0 20px rgba(230,36,41,0.8), 3px 3px 0 #000;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  #start-screen p {
    font-size: 14px;
    opacity: 0.8;
    margin-bottom: 30px;
    text-align: center;
    padding: 0 30px;
    line-height: 1.6;
  }
  #start-btn {
    background: #e62429;
    color: #fff;
    border: none;
    padding: 16px 48px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 30px;
    box-shadow: 0 0 20px rgba(230,36,41,0.6);
    letter-spacing: 1px;
  }

  #joy-hint {
    position: fixed;
    bottom: env(safe-area-inset-bottom, 20px);
    left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    z-index: 10;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="start-screen">
  <h1>SPIDER BOY</h1>
  <p>โหนใยข้ามตึกในเมือง<br>แตะค้างที่หน้าจอเพื่อยิงใยไปทิศทางที่แตะ<br>ปล่อยนิ้วเพื่อปล่อยใยและกระโดด</p>
  <button id="start-btn">เริ่มเกม</button>
</div>

<div id="game-container"></div>

<div id="hud" style="display:none;">
  <div id="logo">🕸️ SPIDER BOY</div>
  <div id="stats">
    ระยะทาง: <span id="distance">0</span>m<br>
    ความเร็ว: <span id="speed">0</span>
  </div>
</div>

<div id="center-msg" style="display:none; opacity:0;"></div>
<div id="joy-hint" style="display:none;">แตะค้าง = ยิงใย/แกว่ง &nbsp;|&nbsp; ปล่อยนิ้ว = ปล่อยใย</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
