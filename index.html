<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Spider Boy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0e1a;
    font-family: 'Segoe UI', Arial, sans-serif;
    touch-action: none;
    user-select: none;
  }
  #game-container {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
  }
  canvas { display: block; touch-action: none; }

  /* ---------- HUD (landscape) ---------- */
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: env(safe-area-inset-top, 10px) env(safe-area-inset-right, 16px) 0 env(safe-area-inset-left, 16px);
    pointer-events: none;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  #logo {
    font-size: 18px;
    font-weight: 900;
    color: #e62429;
    text-shadow: 0 0 8px rgba(230,36,41,0.6), 2px 2px 0 #000;
    letter-spacing: 1px;
  }
  #stats {
    text-align: right;
    color: #fff;
    font-size: 12px;
    text-shadow: 1px 1px 2px #000;
    line-height: 1.4;
  }
  #stats span { font-weight: 700; color: #4fd1ff; }

  #center-msg {
    position: fixed;
    top: 22%; left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 14px;
    text-align: center;
    text-shadow: 1px 1px 3px #000;
    background: rgba(0,0,0,0.4);
    padding: 10px 18px;
    border-radius: 10px;
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.4s;
    max-width: 70vw;
  }

  /* ---------- Start screen ---------- */
  #start-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, #1a0f0f 0%, #2b0a0a 60%, #0a0e1a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    color: #fff;
    padding: 20px;
  }
  #start-screen h1 {
    font-size: 38px;
    font-weight: 900;
    color: #e62429;
    text-shadow: 0 0 20px rgba(230,36,41,0.8), 3px 3px 0 #000;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  #start-screen p {
    font-size: 13px;
    opacity: 0.85;
    margin-bottom: 26px;
    text-align: center;
    max-width: 480px;
    line-height: 1.6;
  }
  #start-btn {
    background: #e62429;
    color: #fff;
    border: none;
    padding: 14px 44px;
    font-size: 17px;
    font-weight: 700;
    border-radius: 30px;
    box-shadow: 0 0 20px rgba(230,36,41,0.6);
    letter-spacing: 1px;
  }

  /* ---------- Rotate device overlay ---------- */
  #rotate-overlay {
    position: fixed;
    inset: 0;
    background: #0a0e1a;
    z-index: 999;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #fff;
    text-align: center;
    padding: 20px;
  }
  #rotate-overlay .icon { font-size: 50px; margin-bottom: 14px; animation: rotate-hint 1.6s ease-in-out infinite; }
  @keyframes rotate-hint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }
  @media (orientation: portrait) {
    #rotate-overlay { display: flex; }
  }

  /* ---------- Joystick (left) ---------- */
  #joystick-base {
    position: fixed;
    left: max(28px, env(safe-area-inset-left));
    bottom: max(28px, env(safe-area-inset-bottom));
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.35);
    z-index: 20;
    touch-action: none;
  }
  #joystick-knob {
    position: absolute;
    top: 50%; left: 50%;
    width: 54px;
    height: 54px;
    margin: -27px 0 0 -27px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    border: 2px solid rgba(255,255,255,0.8);
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
    pointer-events: none;
    transition: background 0.15s;
  }
  #joystick-base.active #joystick-knob {
    background: rgba(79, 209, 255, 0.75);
  }

  /* ---------- Web button (right) ---------- */
  #web-button {
    position: fixed;
    right: max(36px, env(safe-area-inset-right));
    bottom: max(38px, env(safe-area-inset-bottom));
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: rgba(230,36,41,0.25);
    border: 3px solid rgba(255,255,255,0.55);
    z-index: 20;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: #fff;
    text-shadow: 0 0 8px rgba(0,0,0,0.5);
  }
  #web-button.active {
    background: rgba(230,36,41,0.55);
    border-color: #fff;
    transform: scale(1.08);
  }

  #jump-hint {
    position: fixed;
    right: max(36px, env(safe-area-inset-right));
    bottom: max(142px, calc(38px + env(safe-area-inset-bottom) + 108px));
    color: rgba(255,255,255,0.65);
    font-size: 11px;
    z-index: 20;
    text-align: center;
    width: 96px;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="rotate-overlay">
  <div class="icon">📱</div>
  <div>โปรดหมุนอุปกรณ์เป็นแนวนอน<br>เพื่อเล่น Spider Boy</div>
</div>

<div id="start-screen">
  <h1>SPIDER BOY</h1>
  <p>โหนใยข้ามตึกในเมือง (โหมดแนวนอน)<br>
     จอยด้านซ้าย = เดิน &nbsp;|&nbsp; ปุ่ม 🕸️ ด้านขวา = ยิงใย/แกว่ง<br>
     กดปุ่มใยค้างไว้แล้วลากเพื่อบังคับทิศทางแกว่ง ปล่อยนิ้วเพื่อปล่อยใย</p>
  <button id="start-btn">เริ่มเกม</button>
</div>

<div id="game-container"></div>

<div id="hud" style="display:none;">
  <div id="logo">🕸️ SPIDER BOY</div>
  <div id="stats">
    ระยะทาง: <span id="distance">0</span>m<br>
    ความเร็ว: <span id="speed">0</span>
  </div>
</div>

<div id="center-msg" style="display:none; opacity:0;"></div>

<div id="joystick-base" style="display:none;">
  <div id="joystick-knob"></div>
</div>
<div id="web-button" style="display:none;">🕸️</div>
<div id="jump-hint" style="display:none;">แตะสั้นๆ = กระโดด</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
